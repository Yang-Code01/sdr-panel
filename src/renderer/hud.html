<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; }
  .hud {
    width: 252px; height: 56px; border-radius: 14px;
    display: flex; align-items: center; gap: 11px; padding: 0 13px;
    background: rgba(38, 38, 42, 0.72);
    border: 0.5px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 16px 34px -16px rgba(0, 0, 0, 0.8);
    color: #f2f2f7;
    opacity: 0; transform: translateY(-4px) scale(0.985);
    transition: opacity 0.14s ease, transform 0.14s ease;
    backdrop-filter: blur(18px);
  }
  .hud.in { opacity: 1; transform: none; }
  .sun { opacity: 0.92; flex: none; }
  .mid { flex: 1; min-width: 0; }
  .bar { height: 5px; border-radius: 3px; background: rgba(120, 120, 128, 0.45); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 60%; background: #f2f2f7; border-radius: 3px; transition: width 0.08s linear; }
  .line { font-size: 10px; color: rgba(235, 235, 245, 0.55); margin-top: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { font-size: 14px; font-variant-numeric: tabular-nums; opacity: 0.86; min-width: 42px; text-align: right; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="hud" id="hud">
    <svg class="sun" width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <circle cx="8" cy="8" r="3"/>
      <path d="M8 1.4v1.5M8 13.1v1.5M1.4 8h1.5M13.1 8h1.5M3.3 3.3l1 1M11.7 11.7l1 1M12.7 3.3l-1 1M4.3 11.7l-1 1"/>
    </svg>
    <div class="mid">
      <div class="bar"><i id="fill"></i></div>
      <div class="line" id="line">—</div>
    </div>
    <div class="num"><span id="n">--</span>%</div>
  </div>
<script>
  const hud = document.getElementById('hud');
  const fill = document.getElementById('fill');
  const num = document.getElementById('n');
  const line = document.getElementById('line');
  let hideTimer = null;

  function paint(payload) {
    const list = payload.displays || [];
    const d = list.find((x) => x.key === payload.selectedKey) || list[0];
    if (!d) return;
    num.textContent = d.step;
    fill.style.width = d.step + '%';
    line.textContent = payload.line || `${d.name} · ${d.nits} nits`;
  }

  window.api.onHud((payload) => {
    paint(payload);
    hud.classList.add('in');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => hud.classList.remove('in'), 1350);
    setTimeout(() => window.api.hideHud(), 1600);
  });
  window.api.onState(paint);
</script>
</body>
</html>
